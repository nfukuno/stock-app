<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}日足予想{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1f2430; --muted:#6b7280; --line:#e3e6ec; --up:#d6403a; --down:#1f7ae0; --accent:#2f5bea; --ok:#1e9e5a; --ng:#d6403a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  header.nav { background:#fff; border-bottom:1px solid var(--line); padding:8px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header.nav a { color:var(--fg); text-decoration:none; font-weight:600; }
  header.nav a.active { color:var(--accent); }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  h1 { font-size:20px; margin:4px 0 12px; } h2 { font-size:16px; margin:0 0 10px; }
  table { border-collapse:collapse; width:100%; } th,td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; }
  .muted { color:var(--muted); } .pos { color:var(--ok); } .neg { color:var(--ng); }
  button, .btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; text-decoration:none; display:inline-block; }
  button:disabled { background:#aab; cursor:not-allowed; }
  input, select, textarea { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; background:#eef1f8; }
  .badge.warn { background:#ffe1df; } .badge.late { background:#fff1d6; } .badge.ok { background:#dff5e8; } .badge.pending { background:#eef1f8; }
  dialog.editdlg { border:1px solid var(--line); border-radius:12px; padding:16px 18px; width:min(640px, calc(100vw - 32px)); }
  dialog.editdlg::backdrop { background:rgba(20,24,40,.35); }
  .editdlg h2 { font-size:15px; } .editdlg .egrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(185px,1fr)); gap:8px 12px; }
  .editdlg label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  .editdlg label.blk { margin-top:10px; } .editdlg .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .editdlg .chips label { flex-direction:row; align-items:center; color:var(--fg); font-size:13px; }
  .editdlg .emsg { min-height:1.2em; margin:4px 0; }
  button.editbtn { background:transparent; color:var(--accent); border:1px solid var(--line); padding:2px 8px; font-size:12px; border-radius:6px; }
  .memo-line { font-size:12px; color:var(--muted); max-width:260px; white-space:normal; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="nav">
  <a href="/forecast" class="{{ 'active' if nav == 'index' }}">日足予想</a>
  <a href="/forecast/dashboard" class="{{ 'active' if nav == 'dashboard' }}">成績ダッシュボード</a>
  <a href="/trade" class="{{ 'active' if nav == 'trade' }}">トレード口座</a>
  <a href="/trade/history" class="{{ 'active' if nav == 'trade_history' }}">トレード分析</a>
  <a href="/" class="muted">ドローダウン一覧</a>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
