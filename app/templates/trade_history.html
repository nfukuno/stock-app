{% extends "forecast_base.html" %}
{% set nav = 'trade_history' %}
{% block title %}トレード分析{% endblock %}
{% block head %}
<style>
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .kpi { border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .kpi .v { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
  .kpi .l { font-size:12px; color:var(--muted); }
  .groups { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr)); gap:14px; }
  .groups .card { overflow-x:auto; } .groups th, .groups td { white-space:nowrap; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .long { color:var(--up); font-weight:600; } .short { color:var(--down); font-weight:600; }
  .table-wrap th, .table-wrap td { white-space:nowrap; } .table-wrap td.wrap { white-space:normal; min-width:220px; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .table-wrap { overflow-x:auto; } svg text { font-size:11px; fill:var(--muted); }
</style>
{% endblock %}
{% block body %}
<h1>トレード分析 <span class="muted" style="font-size:13px;font-weight:400" id="acct"></span></h1>
<div class="card toolbar">
  <label>期間（返済日） <input type="date" id="from"> 〜 <input type="date" id="to"></label>
  <button type="button" id="csv">CSV ダウンロード</button>
  <button type="button" id="copysum">成績サマリーをコピー</button>
  <span class="muted" style="font-size:12px">各約定の「📋」で、1件ずつレビュー用の文章をコピーできます</span>
</div>
<div class="card"><div class="kpis" id="kpis"></div></div>
<div class="card"><h2>損益曲線（確定損益の累計）</h2><div id="curve" class="muted">-</div></div>
<div class="groups" id="groups"></div>
<div class="card">
  <h2>約定履歴</h2>
  <div class="table-wrap"><table>
    <thead><tr><th>ID</th><th>建日時 → 返済日時</th><th>銘柄</th><th>区分</th><th>売買</th><th class="num">株数</th><th class="num">建値→返済</th>
      <th class="num">損益</th><th class="num">金利等</th><th class="num">R</th><th>理由タグ / 感情</th><th>メモ</th></tr></thead>
    <tbody id="trades"></tbody>
  </table></div>
</div>
<script>window.TRADE = {labels: {{ margin_types | tojson }}, tags: {{ tags | tojson }}, emotions: {{ emotions | tojson }}, memo_max: {{ memo_max }}, exit_types: {{ exit_types | tojson }}, rr_base: {{ rr_base }}};</script>
<script src="/static/js/trade_edit.js?v={{ v }}"></script>
<script src="/static/js/trade_history.js?v={{ v }}"></script>
{% endblock %}
